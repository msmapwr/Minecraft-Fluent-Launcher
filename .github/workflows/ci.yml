name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build (x64) & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build main app (Release, x64)
        run: dotnet build WINUI.csproj -c Release -p:Platform=x64

      - name: Build & run unit tests (x64)
        run: dotnet test tests/WINUI.Tests/WINUI.Tests.csproj -c Release -p:Platform=x64 --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/WINUI.Tests/TestResults/results.trx
          if-no-files-found: ignore
