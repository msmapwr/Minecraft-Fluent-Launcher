name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Publish MSIX & portable zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish self-contained package (x64)
        run: >
          dotnet publish WINUI.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifierOverride=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir="${{ github.workspace }}\msix\"
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=false

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # MSIX：优先包目录（AppxPackageDir 必须以反斜杠结尾才生效），兜底全仓库扫描
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "msix"), "WINUI\AppPackages" -Recurse -Include *.msix,*.msixupload -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) { Copy-Item $msix.FullName $out }

          # 便携 zip：dotnet publish 的确定输出目录；找不到时兜底按 exe 所在目录定位
          $publishDir = "WINUI\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
          if (-not (Test-Path $publishDir)) {
            $exe = Get-ChildItem -Path "WINUI\bin\x64\Release" -Recurse -Filter "MinecraftFluentLauncher.exe" -File -ErrorAction SilentlyContinue |
              Sort-Object { if ($_.DirectoryName -like "*publish*") { 0 } else { 1 } } | Select-Object -First 1
            if ($exe) { $publishDir = $exe.DirectoryName }
          }
          if (-not (Test-Path $publishDir)) { throw "Publish output directory not found" }
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath (Join-Path $out "MinecraftFluentLauncher-portable-win-x64.zip") -Force

          $files = Get-ChildItem $out
          if (-not $files) { throw "No artifacts collected (no msix and no publish output)" }
          $files | ForEach-Object { Write-Host "artifact: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
