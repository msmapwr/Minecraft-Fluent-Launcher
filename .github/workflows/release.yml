name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Publish MSIX & portable zip
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # 第一次发布：产出未签名 MSIX（打包模式下 publish 目录结构不固定，只取包产物）
      - name: Publish MSIX (x64, self-contained)
        run: >
          dotnet publish WINUI.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifierOverride=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir="${{ github.workspace }}\msix\"
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxPackageSigningEnabled=false

      # 第二次发布：产出明确的便携目录（不打包），供 zip 使用
      - name: Publish portable output (x64, self-contained)
        run: >
          dotnet publish WINUI.csproj
          -c Release
          -p:Platform=x64
          -p:RuntimeIdentifierOverride=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:GenerateAppxPackageOnBuild=false
          -o "${{ github.workspace }}\portable"

      - name: Collect artifacts
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          # MSIX：AppxPackageDir 必须以反斜杠结尾才生效；缺失只告警，不阻断便携包
          $msix = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE "msix") -Recurse -Include *.msix,*.msixupload -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msix) { Copy-Item $msix.FullName $out } else { Write-Host "::warning::No MSIX package found" }

          # 便携 zip：来自明确的 -o 输出目录
          $portable = Join-Path $env:GITHUB_WORKSPACE "portable"
          if (-not (Test-Path $portable)) { throw "Portable publish output missing: $portable" }
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath (Join-Path $out "MinecraftFluentLauncher-portable-win-x64.zip") -Force

          $files = Get-ChildItem $out
          if (-not $files) { throw "No artifacts collected" }
          $files | ForEach-Object { Write-Host "artifact: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
